<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Search Courses</title>
    <style>
        body {
            font-family: Arial;
            padding: 25px;
            background: #f1f5f9
        }

        .courses {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px
        }

        .course {
            background: white;
            padding: 18px;
            border-radius: 8px
        }

        .match {
            background: #fde68a;
            font-weight: bold
        }

        input {
            padding: 12px;
            width: min(500px, 90%);
            margin-bottom: 12px
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="07.search-courses.js" defer></script>
</head>

<body>
    <main>
        <h1>Find a Course</h1><input id="search" placeholder="Search courses..."><button id="clear">Clear
            Search</button>
        <p id="count">Showing 5 courses</p>
        <section class="courses">
            <article class="course">HTML and CSS Basics</article>
            <article class="course">JavaScript for Beginners</article>
            <article class="course">Python Programming</article>
            <article class="course">Data Structures</article>
            <article class="course">Introduction to Cybersecurity</article>
        </section>
        <script>
            $(function(){
  const courseCards=$(".course");
  $("#search").on("keyup",function(){
    const term=$(this).val().toLowerCase().trim();let count=0;
    courseCards.each(function(){
      const original=$(this).text();
      // Clear old highlighting before checking the current search term.
      $(this).text(original).show();
      if(!term){count++;return;}
      const position=original.toLowerCase().indexOf(term);
      if(position!==-1){
        count++;
        const before=original.slice(0,position),matched=original.slice(position,position+term.length),after=original.slice(position+term.length);
        $(this).html(document.createTextNode(before).text()+"<span class='match'></span>");
        $(this).find(".match").text(matched).after(document.createTextNode(after));
        $(this).show().css("border","2px solid #16a34a");
      }else{$(this).hide().css("border","");}
    });
    $("#count").text("Matched courses: "+count);
  });
  $("#clear").on("click",function(){$("#search").val("").trigger("keyup");});
});
        </script>
    </main>
</body>

</html>
