<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Theme Switcher</title>
<style>
body{font-family:Arial;margin:0;padding:35px;transition:.2s;background:#fff;color:#222}
.panel{max-width:600px;margin:auto;padding:25px;border:1px solid #aaa;border-radius:12px}
button{padding:11px 18px;margin:5px;border:0;border-radius:6px;cursor:pointer}
body.light{background:#fff;color:#222}body.dark{background:#171717;color:#f5f5f5}body.dark .panel{background:#262626;border-color:#555}
body.blue{background:#dbeafe;color:#12315b}body.blue .panel{background:#eff6ff;border-color:#60a5fa}
</style></head><body class="light" data-theme="light"><main class="panel"><h1>Theme Switcher</h1><p>Select a theme for this page.</p>
<button data-choice="light">Light</button><button data-choice="dark">Dark</button><button data-choice="blue">Blue</button><p id="themeStatus">Current theme: Light</p></main>
<script>
const themeButtons=document.querySelectorAll('button[data-choice]');
themeButtons.forEach(button=>button.addEventListener('click',()=>{
 const selectedTheme=button.getAttribute('data-choice');
 // setAttribute updates both the theme class and the custom data attribute.
 document.body.setAttribute('class',selectedTheme);
 document.body.setAttribute('data-theme',selectedTheme);
 document.getElementById('themeStatus').textContent='Current theme: '+selectedTheme[0].toUpperCase()+selectedTheme.slice(1);
}));
</script></body></html>
