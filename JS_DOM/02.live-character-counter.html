<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Live Character Counter</title>
<style>
body{font-family:Arial;background:#f4f6f8;padding:30px}.box{max-width:550px;margin:auto;background:white;padding:24px;border-radius:12px}
textarea{box-sizing:border-box;width:100%;height:160px;padding:12px;font:16px Arial;border:1px solid #aaa;border-radius:7px}
#counter{font-weight:bold;color:green;margin:10px 0}#counter.warning{color:#d69e00}#counter.danger{color:#dc2626}
button{padding:10px 18px;background:#2563eb;color:white;border:0;border-radius:6px;cursor:pointer}
</style></head><body><main class="box"><h1>Character Counter</h1><textarea id="message" maxlength="100" placeholder="Type up to 100 characters..."></textarea>
<p id="counter">100 characters remaining</p><button id="resetButton">Reset</button></main>
<script>
const message=document.getElementById('message'),counter=document.getElementById('counter');
const maximumCharacters=100;
function updateCounter(){
 const remaining=maximumCharacters-message.value.length;
 counter.textContent=remaining+' characters remaining';
 counter.className=remaining===0?'danger':remaining<=20?'warning':'';
}
// Prevent typing or pasting additional characters after the limit.
message.addEventListener('beforeinput',event=>{
 if(message.value.length>=maximumCharacters && event.data && event.inputType==='insertText')event.preventDefault();
});
message.addEventListener('input',updateCounter);
document.getElementById('resetButton').addEventListener('click',()=>{
 message.value='';updateCounter();message.focus();
});
</script></body></html>
