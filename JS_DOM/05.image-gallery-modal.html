<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Image Gallery</title>
<style>
body{font-family:Arial;background:#f4f6f8;padding:25px}.gallery{max-width:850px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.gallery img{width:100%;height:170px;object-fit:cover;border-radius:9px;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:#000c;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}
.modal-content{position:relative;background:white;padding:12px;border-radius:10px;max-width:850px;width:90%}.modal-content img{display:block;width:100%;max-height:80vh;object-fit:contain}
.close{position:absolute;right:8px;top:8px;border:0;border-radius:50%;padding:8px 12px;cursor:pointer}
@media(max-width:600px){.gallery{grid-template-columns:repeat(2,1fr)}}
</style></head><body><h1>Image Gallery</h1><div class="gallery" id="gallery">
<img src="https://picsum.photos/id/1015/600/400" alt="Mountain landscape"><img src="https://picsum.photos/id/1016/600/400" alt="Forest landscape"><img src="https://picsum.photos/id/1025/600/400" alt="Dog"><img src="https://picsum.photos/id/1035/600/400" alt="River"><img src="https://picsum.photos/id/1043/600/400" alt="Beach"><img src="https://picsum.photos/id/1069/600/400" alt="Nature">
</div><div class="modal" id="modal"><div class="modal-content" id="modalContent"><button class="close" id="closeButton">X</button><img id="largeImage" alt="Selected image preview"></div></div>
<script>
const gallery=document.getElementById('gallery'),modal=document.getElementById('modal'),largeImage=document.getElementById('largeImage'),modalContent=document.getElementById('modalContent');
gallery.addEventListener('click',event=>{
 if(event.target.tagName!=='IMG')return;
 largeImage.src=event.target.src;largeImage.alt=event.target.alt;modal.classList.add('open');
});
modal.addEventListener('click',()=>modal.classList.remove('open'));
modalContent.addEventListener('click',event=>event.stopPropagation());
document.getElementById('closeButton').addEventListener('click',()=>modal.classList.remove('open'));
document.addEventListener('keydown',event=>{if(event.key==='Escape')modal.classList.remove('open');});
</script></body></html>
