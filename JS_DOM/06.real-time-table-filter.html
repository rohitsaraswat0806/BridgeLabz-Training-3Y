<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Student Table Filter</title>
<style>
body{font-family:Arial;padding:30px;background:#f4f6f8}.card{max-width:700px;margin:auto;background:white;padding:24px;border-radius:12px}
input{padding:11px;width:95%;margin-bottom:15px;border:1px solid #aaa;border-radius:6px}
table{width:100%;border-collapse:collapse}th,td{padding:11px;text-align:left;border-bottom:1px solid #ddd}th{background:#e5e7eb}#noResults{color:#dc2626}
</style></head><body><main class="card"><h1>Student Records</h1><input id="searchInput" placeholder="Search by name, branch or CGPA...">
<table><thead><tr><th>Name</th><th>Branch</th><th>CGPA</th></tr></thead><tbody id="studentRows">
<tr><td>Aarav</td><td>CSE</td><td>8.5</td></tr><tr><td>Priya</td><td>IT</td><td>9.1</td></tr><tr><td>Rohan</td><td>ECE</td><td>7.8</td></tr><tr><td>Meera</td><td>CSE</td><td>8.9</td></tr><tr><td>Kabir</td><td>Mechanical</td><td>7.5</td></tr><tr><td>Ananya</td><td>IT</td><td>8.2</td></tr>
</tbody></table><p id="noResults" hidden>No results found</p></main>
<script>
const searchInput=document.getElementById('searchInput'),studentRows=document.getElementById('studentRows');
searchInput.addEventListener('input',()=>{
 const searchTerm=searchInput.value.trim().toLowerCase();let visibleCount=0;
 [...studentRows.rows].forEach(row=>{
  const matches=row.textContent.toLowerCase().includes(searchTerm);
  row.hidden=!matches;if(matches)visibleCount++;
 });
 document.getElementById('noResults').hidden=visibleCount!==0;
});
</script></body></html>
