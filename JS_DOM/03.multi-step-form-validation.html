<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Multi-Step Form</title>
<style>
body{font-family:Arial;background:#eef2f7;padding:30px}.card{max-width:480px;margin:auto;background:white;padding:25px;border-radius:12px}
.step{display:none}.step.active{display:block}input{width:100%;box-sizing:border-box;padding:11px;margin:10px 0;border:1px solid #aaa;border-radius:6px}
button{padding:10px 18px;margin:5px 5px 0 0;border:0;border-radius:6px;background:#2563eb;color:white;cursor:pointer}.back{background:#64748b}
.error{color:#dc2626;min-height:20px}
</style></head><body><main class="card"><h1>Registration</h1><p id="stepLabel">Step 1 of 3</p>
<form id="multiForm" novalidate>
<section class="step active"><h2>Your Name</h2><input id="name" placeholder="Full name" autocomplete="name"><p class="error" id="nameError"></p></section>
<section class="step"><h2>Your Email</h2><input id="email" type="email" placeholder="Email address" autocomplete="email"><p class="error" id="emailError"></p></section>
<section class="step"><h2>Create Password</h2><input id="password" type="password" placeholder="At least 6 characters" autocomplete="new-password"><p class="error" id="passwordError"></p></section>
<div id="navigation"><button type="button" class="back" id="backButton" hidden>Back</button><button type="button" id="nextButton">Next</button></div>
</form><section id="summary" hidden><h2>Registration Complete</h2><p id="summaryText"></p></section></main>
<script>
const steps=[...document.querySelectorAll('.step')];let currentStep=0;
const fields=[document.getElementById('name'),document.getElementById('email'),document.getElementById('password')];
function showStep(){steps.forEach((step,index)=>step.classList.toggle('active',index===currentStep));document.getElementById('stepLabel').textContent=`Step ${currentStep+1} of 3`;document.getElementById('backButton').hidden=currentStep===0;document.getElementById('nextButton').textContent=currentStep===2?'Finish':'Next';}
function validateCurrentStep(){
 const value=fields[currentStep].value.trim();let error='';
 if(currentStep===0 && value.length<2)error='Please enter your name (at least 2 characters).';
 if(currentStep===1 && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value))error='Please enter a valid email address.';
 if(currentStep===2 && value.length<6)error='Password must contain at least 6 characters.';
 document.getElementById(['nameError','emailError','passwordError'][currentStep]).textContent=error;
 return !error;
}
document.getElementById('nextButton').addEventListener('click',()=>{
 if(!validateCurrentStep())return;
 if(currentStep<2){currentStep++;showStep();}else{
 document.getElementById('multiForm').hidden=true;document.getElementById('stepLabel').hidden=true;
 document.getElementById('summary').hidden=false;
 document.getElementById('summaryText').textContent=`Name: ${fields[0].value.trim()} | Email: ${fields[1].value.trim()} | Password: ••••••`;
 }
});
document.getElementById('backButton').addEventListener('click',()=>{if(currentStep>0){currentStep--;showStep();}});
</script></body></html>
