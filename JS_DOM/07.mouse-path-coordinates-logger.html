<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mouse Coordinates Logger</title>
<style>
body{font-family:Arial;padding:25px}.play-area{width:400px;height:400px;max-width:90vw;max-height:90vw;background:#e0f2fe;border:2px solid #2563eb;position:relative;overflow:hidden;cursor:crosshair}
#coordinates{font-weight:bold;margin:12px 0}.dot{position:absolute;width:12px;height:12px;border-radius:50%;background:red;transform:translate(-50%,-50%);pointer-events:none}
</style></head><body><h1>Mouse Coordinates Logger</h1><p>Move your mouse inside the box. Double-click to place a red dot.</p>
<p id="coordinates">clientX: -- | clientY: --</p><div class="play-area" id="playArea"></div>
<script>
const playArea=document.getElementById('playArea'),coordinates=document.getElementById('coordinates');
playArea.addEventListener('mousemove',event=>{
 coordinates.textContent=`clientX: ${event.clientX} | clientY: ${event.clientY}`;
});
playArea.addEventListener('dblclick',event=>{
 const bounds=playArea.getBoundingClientRect(),dot=document.createElement('span');
 dot.className='dot';dot.style.left=(event.clientX-bounds.left)+'px';dot.style.top=(event.clientY-bounds.top)+'px';
 playArea.appendChild(dot);
});
</script></body></html>
