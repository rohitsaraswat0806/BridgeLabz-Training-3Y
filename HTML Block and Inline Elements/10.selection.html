<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Location Selection</title>
</head>
<body>
    <h1>Select Your Travel Preferences</h1>
    <label for="country">Country:</label>
    <select id="country"><option selected>India</option><option>USA</option><option>Japan</option><option>France</option></select>
    <br><br>
    <label for="state">State:</label>
    <select id="state"><option selected>Uttar Pradesh</option><option>Delhi</option><option>Maharashtra</option><option>Rajasthan</option></select>
    <br><br>
    <label for="city">City:</label>
    <select id="city"><option selected>Mathura</option><option>Agra</option><option>Lucknow</option><option>Varanasi</option></select>
    <br><br>
    <label for="place">Favorite Tourist Place:</label>
    <select id="place"><option selected>Taj Mahal</option><option>Vrindavan</option><option>Gateway of India</option><option>Red Fort</option></select>
    <p>My selected choices are India, Uttar Pradesh, Mathura, and my favorite tourist place is the Taj Mahal.</p>
</body>
</html>
