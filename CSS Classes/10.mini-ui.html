<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Mini UI</title>
    <link rel="stylesheet" href="10.mini-ui.css">
</head>
<body>
    <header><h1>Study Planner</h1></header>
    <main class="main-card">
        <section class="intro">
            <img src="https://picsum.photos/seed/study/320/220" alt="Study workspace">
            <div><h2>Plan Your Session</h2><p>Create a simple study task and keep your work organized.</p></div>
        </section>
        <form>
            <label for="task">Task name</label>
            <input id="task" type="text" placeholder="Enter your task">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="you@example.com">
            <div class="form-buttons"><button type="submit">Create Task</button><button type="reset" class="reset">Reset</button></div>
        </form>
    </main>
    <footer><p>Mini UI Layout — Assignment 8</p></footer>
</body>
</html>
