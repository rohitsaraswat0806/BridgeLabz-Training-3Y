<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="03.image-showcase.css">
</head>
<body>
    <header><h1>Image Showcase</h1><p>A responsive six-image gallery.</p></header>
    <main class="gallery">
        <figure><div class="image-wrap"><img src="https://picsum.photos/seed/mountain/600/400" alt="Mountain landscape"><div class="overlay"></div></div><figcaption>Mountain Escape</figcaption></figure>
        <figure><div class="image-wrap"><img src="https://picsum.photos/seed/ocean/600/400" alt="Ocean view"><div class="overlay"></div></div><figcaption>Ocean View</figcaption></figure>
        <figure><div class="image-wrap"><img src="https://picsum.photos/seed/forest/600/400" alt="Forest"><div class="overlay"></div></div><figcaption>Green Forest</figcaption></figure>
        <figure><div class="image-wrap"><img src="https://picsum.photos/seed/city/600/400" alt="City"><div class="overlay"></div></div><figcaption>City Lights</figcaption></figure>
        <figure><div class="image-wrap"><img src="https://picsum.photos/seed/desert/600/400" alt="Desert"><div class="overlay"></div></div><figcaption>Desert Road</figcaption></figure>
        <figure><div class="image-wrap"><img src="https://picsum.photos/seed/lake/600/400" alt="Lake"><div class="overlay"></div></div><figcaption>Quiet Lake</figcaption></figure>
    </main>
    <footer><p>Responsive Gallery — Assignment 8</p></footer>
</body>
</html>
