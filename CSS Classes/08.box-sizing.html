<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box-Sizing Comparison</title>
    <link rel="stylesheet" href="08.box-sizing.css">
</head>
<body>
    <header><h1>Box-Sizing Comparison</h1></header>
    <main class="comparison">
        <section class="box default"><h2>Default: content-box</h2><div>Width: 260px<br>Padding: 30px<br>Border: 5px</div><p>Total width becomes larger than 260px.</p></section>
        <section class="box border-box"><h2>border-box</h2><div>Width: 260px<br>Padding: 30px<br>Border: 5px</div><p>Total width stays exactly 260px.</p></section>
    </main>
    <footer><p>Box-Sizing Practice — Assignment 8</p></footer>
</body>
</html>
