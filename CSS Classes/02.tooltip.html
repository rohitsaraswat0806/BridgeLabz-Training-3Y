<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="02.tooltip.css">
</head>
<body>
    <header><h1>CSS Tooltip Demonstration</h1></header>
    <main class="tooltip-area">
        <section class="tooltip-card"><span class="icon">★</span><span class="tooltip">This is a star tooltip.</span><p>Star</p></section>
        <section class="tooltip-card"><span class="icon">?</span><span class="tooltip">This tooltip explains the help icon.</span><p>Help</p></section>
        <section class="tooltip-card"><span class="icon">!</span><span class="tooltip">Important information appears here.</span><p>Alert</p></section>
        <section class="tooltip-card"><span class="icon">i</span><span class="tooltip">Extra information is shown here.</span><p>Info</p></section>
    </main>
    <footer><p>Hover an item to see its tooltip.</p></footer>
</body>
</html>
