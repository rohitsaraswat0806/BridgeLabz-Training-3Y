<!DOCTYPE html>
<html>
<head>
    <!-- Sets the page title shown in the browser tab -->
    <title>Important Head Elements</title>

    <!-- Defines character encoding -->
    <meta charset="UTF-8">

    <!-- Provides a description of the webpage -->
    <meta name="description" content="A webpage demonstrating important head elements.">

    <!-- Specifies the author of the webpage -->
    <meta name="author" content="Rohit">

    <!-- Sets a base URL for relative links -->
    <base href="https://example.com/">

    <!-- Links an external resource such as a favicon -->
    <link rel="icon" href="favicon.ico">

    <!-- Used to add internal CSS -->
    <style></style>

    <!-- Used to add or link JavaScript -->
    <script></script>
</head>
<body>
    <h1>Important Head Elements</h1>
</body>
</html>
