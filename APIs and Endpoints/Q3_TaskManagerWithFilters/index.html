<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #f4f6f8; }
        .container { max-width: 700px; margin: auto; background: white; padding: 24px; border-radius: 10px; }
        select { padding: 10px; margin: 10px 0 18px; }
        .task { padding: 12px; border-bottom: 1px solid #ddd; }
        .done { text-decoration: line-through; color: #777; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Task Manager</h2>
        <label for="filter">Filter tasks:</label>
        <select id="filter">
            <option value="all">All Tasks</option>
            <option value="Low">Low Priority</option>
            <option value="Medium">Medium Priority</option>
            <option value="High">High Priority</option>
            <option value="completed">Completed</option>
        </select>
        <div id="taskList">Loading tasks...</div>
        <p id="message"></p>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
