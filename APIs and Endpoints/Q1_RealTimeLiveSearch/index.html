<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Live Search</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #f4f6f8; }
        .container { max-width: 700px; margin: auto; background: white; padding: 24px; border-radius: 10px; }
        input { width: 100%; padding: 12px; box-sizing: border-box; margin: 12px 0; }
        .product { display: flex; align-items: center; gap: 16px; padding: 12px; border-bottom: 1px solid #ddd; }
        .product img { width: 100px; height: 75px; object-fit: cover; }
        #loading { color: #2563eb; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Product Live Search</h2>
        <input type="text" id="searchBox" placeholder="Search products...">
        <p id="loading">Loading...</p>
        <div id="results"></div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
