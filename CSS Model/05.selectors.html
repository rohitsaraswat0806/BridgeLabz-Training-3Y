<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced CSS Selectors</title>
    <link rel="stylesheet" href="05.selectors.css">
</head>
<body>
<header><h1>Advanced CSS Selectors</h1></header>
<main>
    <section class="content">
        <h2>Items</h2>
        <ul>
            <li>First item</li><li>Second item</li><li>Third item</li>
        </ul>
        <p class="note">A paragraph for combinator demonstrations.</p>
        <div class="links">
            <a href="https://example.com">Secure Link</a>
            <a href="https://example.org">Another Link</a>
        </div>
        <form>
            <input type="text" placeholder="Type something">
            <input type="email" placeholder="Email">
        </form>
    </section>
</main>
</body>
</html>
