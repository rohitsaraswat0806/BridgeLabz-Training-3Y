<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding</title>
    <link rel="stylesheet" href="01.border.css">
</head>
<body>
<header><h1>Borders & Padding</h1></header>
<main>
    <section class="boxes">
        <div class="box solid">Solid Border</div>
        <div class="box dashed">Dashed Border</div>
        <div class="box double">Double Border</div>
        <div class="box groove">Groove Border</div>
        <div class="box rounded">Rounded Corners</div>
        <div class="box padding">Large Padding</div>
    </section>
</main>
<footer>Border demonstration page</footer>
</body>
</html>
